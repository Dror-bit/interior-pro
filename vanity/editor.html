<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font:15px 'Segoe UI',sans-serif;background:#f7f7f3;color:#283c32;margin:0}header{padding:18px 22px;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}main{padding:0 22px 90px}label{display:block;font-size:13px;color:#58665e;margin:10px 0}select,input,button{font:inherit;border:1px solid #d5ddd5;border-radius:9px;padding:9px;background:white;color:#283c32}select{width:100%}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}input{width:100%;min-width:0}input[type=checkbox]{width:auto}.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}.choices{display:flex;gap:8px}.choices button{flex:1}.choices button[aria-pressed=true]{border:2px solid #315f4f;background:#e8f0e9;padding:8px}#preview{background:#efefe7;border-radius:14px;margin:8px 0;overflow:hidden}#preview svg{display:block;width:100%;height:300px}.caption{font-size:12px;color:#6b746c;text-align:center;margin:6px}.layoutCards{display:flex;gap:6px}.layoutCards button{padding:8px 5px;flex:1;font-size:12px}.layoutCards svg{display:block;width:100%;height:44px}#columnEditor{background:#edf0e9;padding:10px;border-radius:9px;margin-top:8px}#columnEditor label{margin:0}#columnEditor select{padding:7px}details{margin-top:18px;border-top:1px solid #dce1d9;padding-top:12px}summary{cursor:pointer;font-size:13px}footer{position:fixed;bottom:0;left:0;right:0;padding:12px 22px;background:#f7f7f3;border-top:1px solid #dce1d9}#primary{background:#315f4f;color:white;border:0;width:100%;padding:13px;font-weight:600}#error{color:#a52d22;font-size:13px;white-space:pre-wrap}#existingActions{display:flex;gap:8px;margin-top:8px}#existingActions button{flex:1}[hidden]{display:none!important}
.faucetCards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.faucetCards button{font-size:12px}.faucetCards button[aria-pressed=true]{border:2px solid #315f4f;background:#e8f0e9}.faucetCards img{width:100%;height:85px;object-fit:contain;display:block;margin-bottom:8px}</style><link rel="stylesheet" href="editor_layout.css"></head><body><header><h1>Vanity</h1><button onclick="newCabinet()">＋ חדש</button></header><main>
<select id="list" aria-label="בחירת ארון" onchange="choose()"><option value="">ארון חדש</option></select>
<label hidden><select id="product"><option value="vanity">וונטי — ארון אמבטיה</option><option value="makeup">שולחן מייק־אפ עצמאי</option></select></label>
<div id="preview" aria-label="תצוגה מקדימה של הוונטי"></div><p class="caption">תצוגה מקדימה · מתעדכנת בכל שינוי</p>
<p id="pendingChanges" class="caption" role="status" hidden></p><div class="choices" id="mountChoices"><button onclick="setMount('floating')" data-value="floating">צף</button><button onclick="setMount('floor')" data-value="floor">עומד</button></div>
<div class="row"><label>רוחב כולל (אינץ׳)<input id="width" type="number" value="36" step="0.125" min="12" max="120"></label><label>עומק (אינץ׳)<input id="depth" type="number" value="21" step="0.125" min="12" max="30"></label><label>גובה ארון (אינץ׳)<input id="height" type="number" value="30" step="0.125" min="8" max="42"></label></div>
<label id="legStyleLabel">בסיס הארון<select id="legStyle" onchange="if(mount==='floor')legs=true;update()"><option value="square">רגליים מרובעות בפינות</option><option value="round">רגליים עגולות בפינות</option><option value="plinth">בסיס רציף (צוקל)</option></select></label><label id="mountHeight">גובה מהרצפה (אינץ׳)<input id="z" type="number" value="12" min="0.125" step="0.125"></label>
<div class="row"><label>חזית<select id="style"><option value="slab">חלקה</option><option value="shaker">שייקר</option></select></label><label>צבע ארון<select id="finish"><option value="white">לבן</option><option value="ivory">שמנת</option><option value="gray">אפור</option><option value="white_oak">White Oak</option></select></label><label id="basinLabel">כיורים<select id="basins"><option value="1">אחד</option><option value="2">שניים</option></select></label></div>
<div id="sinkLocations" class="row"><label>מיקום כיור 1<select id="sinkPart0"></select></label><label>מיקום כיור 2<select id="sinkPart1"></select></label></div><div id="layoutTitle"><label>כמה חלקים בוונטי?<select id="partCount" onchange="setPartCount(Number(this.value))"><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></label><p class="caption">לחץ על חלק בתצוגה כדי לערוך אותו · החלקים משמאל לימין</p></div>
<div id="columnEditor"><label>רוחב החלק הנבחר (אינץ׳)<input id="columnWidth" type="number" min="4" max="120" step="0.125" value="36"></label><div class="row"><label>חלק נבחר<select id="column" onchange="selectColumn()"></select></label><label>סוג<select id="columnKind"><option value="doors">דלתות</option><option value="drawers">מגירות</option><option value="doors_drawer">דלתות ומגירה מעל</option><option value="makeup">מייק־אפ</option></select></label><label><span id="columnCountLabel">מספר דלתות</span><select id="columnCount"><option>1</option><option>2</option><option>3</option><option>4</option></select></label></div><label id="columnDrawerLabel" style="margin-top:10px"><input id="columnDrawer" type="checkbox"> <span id="columnDrawerText">מגירה מעל הדלתות</span></label></div>
<div id="makeupSide" hidden><label>מיקום המייק־אפ</label><div class="choices"><button data-side="right" onclick="setMakeupSide('right')">מימין</button><button data-side="left" onclick="setMakeupSide('left')">משמאל</button></div></div>
<label id="makeupDrawer" hidden><input id="drawer" type="checkbox"> מגירה</label><details id="surfaceSettings"><summary>קאונטרטופ וכיורים</summary>
<div class="row"><label>צבע קאונטרטופ<select id="countertop_color"><option value="white">לבן</option><option value="ivory">שמנת</option><option value="gray">אפור</option><option value="black">שחור</option></select></label><label>עובי (אינץ׳)<input id="countertop_thickness" type="number" min="0.5" max="3" step="0.125" value="0.75"></label></div>
<label>גובה באקספלש (0 = ללא)<input id="backsplash_height" type="number" min="0" max="12" step="0.125" value="0"></label>
<div id="sinkSettings"><p class="caption">כיור חרסינה מתחת למשטח · מידות באינץ׳</p><label>דגם כיור<select id="sink_shape"><option value="icera_muse" selected>ICERA Muse Medium</option><option value="oval">אובלי</option><option value="square">מלבני / מרובע</option></select></label>
<div class="row"><label>רוחב כיור<input id="sink_width" type="number" min="10" max="24" step="0.125" value="18.125"></label><label>אורך כיור<input id="sink_depth" type="number" min="8" max="18" step="0.125" value="12.25"></label><label>גובה כיור<input id="sink_height" type="number" min="4" max="9" step="0.125" value="7.875"></label></div>
<div class="row"><label>צבע כיור<select id="sink_color"><option value="white">לבן</option><option value="ivory">שמנת</option><option value="gray">אפור</option><option value="black">שחור</option></select></label></div></div></details>
<details id="faucetSettings"><summary>ברזים · <span id="faucetLabel">ללא ברז</span></summary><label>גימור ברז וניקוז<select id="faucet_finish"><option value="brushed_nickel">ניקל מוברש</option><option value="matte_black">שחור מט</option><option value="satin_brass">Satin Brass</option><option value="chrome" hidden>כרום קודם</option><option value="brass" hidden>פליז קודם</option><option value="black" hidden>שחור קודם</option></select></label><select id="faucet_id" hidden><option value="none">ללא ברז</option></select><button onclick="selectFaucet('none')">ללא ברז</button><div id="faucetCards" class="faucetCards"></div></details><details id="handleSettings"><summary>ידיות</summary><p id="handlePartTitle" class="caption"></p><div id="doorHandleSides"></div><label>ידיות<select id="handle"><option value="keaton">Keaton — ידית</option><option value="warwick">Warwick — ידית צרה</option><option value="hunter">Hunter — כפתור מרובע</option><option value="globe">Globe — כפתור</option><option value="none">ללא</option><option value="brass" hidden>ידית קודמת — פליז</option><option value="black" hidden>ידית קודמת — שחור</option></select></label></details>
<div id="existingActions" hidden><button onclick="send('move')">הזזה במודל</button><button onclick="send('remove')">מחיקה</button></div>
<details><summary>הגלריה שלי</summary><label>שם הארון<input id="gallery_name" maxlength="80"></label><button onclick="send('capture')">הוסף את הבחירה במודל לגלריה</button><label>ארונות שמורים<select id="gallery"></select></label><button id="galleryPlace" onclick="send('gallery_place')">הצב מהגלריה</button></details><p id="error" role="alert"></p></main><footer><button id="primary" onclick="send(document.getElementById('list').value?'save':'place')">הצב במודל</button></footer><script src="handle_preview.js"></script><script src="faucet_assets.js"></script><script src="faucet_preview.js"></script><script src="sink_asset.js"></script><script src="sink_preview.js"></script><script src="layout_preview.js"></script><script src="sink_locations.js"></script><script src="editor.js"></script><script src="dimension_edit.js"></script><script src="editor_layout.js"></script></body></html>
