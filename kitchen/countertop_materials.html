<!doctype html><html><head><meta charset="utf-8"><style>
body{font:14px 'Segoe UI',sans-serif;color:#20332f;background:#fafbf8;margin:24px}h1{font-size:20px}input{padding:10px;width:90%;border:1px solid #ccd6cd;border-radius:6px}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;margin-top:20px}button{background:white;border:1px solid #dde3dc;border-radius:8px;padding:8px;cursor:pointer;color:inherit}button:hover{border-color:#315f4f}img,.swatch{width:100%;height:115px;object-fit:cover;border-radius:4px}strong,small{display:block;margin-top:6px}#error{color:#a43425}
</style></head><body><h1>Countertop materials</h1><p>Apply to all kitchen countertops</p><input id="search" placeholder="Search materials or folders"><p id="error" role="alert"></p><div id="cards"></div><script>
let cards=[];function render(data,title,scope){document.querySelector('h1').textContent=title||'Countertop materials';document.querySelector('p').textContent=scope||'Apply to all kitchen countertops';cards=data;draw();}function draw(){const grid=document.getElementById('cards');grid.replaceChildren();const q=document.getElementById('search').value.toLowerCase();for(const c of cards.filter(c=>[c.name,c.path,c.category].join(' ').toLowerCase().includes(q))){const b=document.createElement('button');b.type='button';const pic=document.createElement(c.img?'img':'div');if(c.img)pic.src=c.img;else{pic.className='swatch';pic.style.background=Array.isArray(c.color)?`rgb(${c.color.slice(0,3).join(',')})`:'#eee';}const title=document.createElement('strong');title.textContent=c.name;const path=document.createElement('small');path.textContent=c.path||c.category||'';b.append(pic,title,path);b.onclick=()=>sketchup.choose(c.id);grid.append(b);}if(!cards.length)grid.textContent='No materials in the Interior Pro library. Add materials there, then reopen this gallery.';}document.getElementById('search').oninput=draw;sketchup.ready();
</script></body></html>
